<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noimageindex">
  <meta name="theme-color" content="#101115">
  <meta name="description" content="Meet the cats behind Blindsided Games. A small collection of very good company.">
  <title>Debug Cats · Blindsided Games</title>
  <link rel="icon" href="brand.jpg" type="image/jpeg">
  <link rel="stylesheet" href="gallery.css">
  <script src="gallery.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#collection">Skip to photos</a>
  <div class="page">
    <header class="masthead">
      <a class="brand" href="https://blindsidedgames.com" aria-label="Blindsided Games home"><img src="brand.jpg" alt="Blindsided Games" width="80" height="80"></a>
    </header>
    <main>
      <section class="intro" aria-labelledby="title">
        <div class="intro-copy">
          <h1 id="title">Debug <span>Cats.</span></h1>
          <p class="lead">The cats behind Blindsided Games.</p>
        </div>
        <button class="feature" data-photo="16" aria-label="Open featured photo: sleepy tuxedo cat">
          <span class="feature-image"><!-- FEATURE --></span>
        </button>
      </section>
      <section id="collection" class="collection" aria-labelledby="collection-title">
        <div class="collection-heading"><h2 id="collection-title">104 photos</h2></div>
        <div id="grid" class="grid"><!-- PHOTOS --></div>
        <div class="more"><p id="progress" aria-live="polite">24 of 104 photos</p><button id="load-more" class="load-more" hidden>More cats <span aria-hidden="true">+</span></button></div>
        <noscript><link rel="stylesheet" href="noscript.css"><p class="noscript">JavaScript is off. All photos are shown below; select one to open the larger image.</p></noscript>
      </section>
    </main>
    <footer><span>BLINDSIDED GAMES</span><a href="#title">Back to top <span aria-hidden="true">↑</span></a></footer>
  </div>
  <dialog id="viewer" aria-label="Photo viewer">
    <div class="viewer-top"><p id="viewer-count" aria-live="polite"></p><button id="close" class="icon-button" aria-label="Close photo viewer">✕</button></div>
    <div class="viewer-stage"><button id="previous" class="icon-button arrow" aria-label="Previous photo">←</button><div id="viewer-image"></div><button id="next" class="icon-button arrow" aria-label="Next photo">→</button></div>
    <div class="viewer-bottom"><p id="viewer-caption"></p><span>← → to explore <span aria-hidden="true">·</span> Esc to close</span></div>
    <p id="image-error" role="status" hidden>This photo couldn’t load. <button id="retry">Try again</button></p>
  </dialog>
</body>
</html>
